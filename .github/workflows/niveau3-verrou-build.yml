name: Niveau 3 — npm, builds et contrôles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/niveau3-verrou-build.yml'
      - 'projects/budget-tana/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verrouiller-et-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Résoudre et verrouiller les dépendances exactes
        shell: bash
        run: |
          set -euo pipefail
          for chemin in             projects/budget-tana/outillage-vite-git             projects/budget-tana/typescript-typages             projects/budget-tana/typescript-architecture; do
            echo "::group::$chemin"
            (cd "$chemin" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            test -s "$chemin/package-lock.json"
            echo "::endgroup::"
          done
      - name: Conserver les fichiers de verrou dans Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/budget-tana/outillage-vite-git/package-lock.json             projects/budget-tana/typescript-typages/package-lock.json             projects/budget-tana/typescript-architecture/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore(budget-tana): verrouiller les dependances npm du niveau 3'
            git push origin HEAD:main
          fi
      - name: Appliquer Prettier au projet outillage et conserver le résultat
        shell: bash
        run: |
          set -euo pipefail
          cd projects/budget-tana/outillage-vite-git
          npm ci --no-audit --no-fund
          npm run format
          cd "$GITHUB_WORKSPACE"
          git add projects/budget-tana/outillage-vite-git
          if ! git diff --staged --quiet; then
            git commit -m 'style(budget-tana): harmoniser le formatage Prettier'
            git push origin HEAD:main
          fi
      - name: Installer, tester et construire les trois jalons
        shell: bash
        run: |
          set -euo pipefail
          for chemin in             projects/budget-tana/outillage-vite-git             projects/budget-tana/typescript-typages             projects/budget-tana/typescript-architecture; do
            echo "::group::$chemin"
            (cd "$chemin" && npm ci --no-audit --no-fund && npm test && npm run build)
            echo "::endgroup::"
          done
      - name: Préparer les trois ZIP complets sans les modules installés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-sources-n3
          for entry in             'outillage-vite-git:budget-tana-vite'             'typescript-typages:budget-tana-typescript'             'typescript-architecture:Budget_Tana_TypeScript_architecture'; do
            dossier="${entry%%:*}"
            nom="${entry#*:}"
            source="projects/budget-tana/$dossier"
            cible="$RUNNER_TEMP/bundles/$nom"
            mkdir -p "$cible"
            cp -a "$source/." "$cible/"
            rm -rf "$cible/node_modules" "$cible/dist"
            rm -f "$cible/Budget_Tana_TypeScript_sources.zip"
            (cd "$RUNNER_TEMP/bundles" && zip -q -r "$GITHUB_WORKSPACE/dist-sources-n3/$nom.zip" "$nom")
            test -s "dist-sources-n3/$nom.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: niveau-3-sources-avec-verrous
          path: dist-sources-n3/*.zip
          retention-days: 7
      - name: Vérifier ESLint et Prettier du projet outillage
        shell: bash
        run: |
          set -euo pipefail
          cd projects/budget-tana/outillage-vite-git
          npm run lint
          npm run format:check
